# Premarket Hunter — web + api/worker + PostgreSQL
# Local:  docker compose up -d --build
# Server: see deploy/digitalocean.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-premarket}
      POSTGRES_USER: ${POSTGRES_USER:-premarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-premarket} -d ${POSTGRES_DB:-premarket}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-premarket}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-premarket}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      API_ACCESS_KEY: ${API_ACCESS_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - apidata:/app/data
      - ./backups:/app/backups:ro

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  apidata:
